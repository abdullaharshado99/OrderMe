# Example Nginx snippets for large chunked uploads (1–5GB total) proxied to NestJS.
# Include inside your `server` or `location` that forwards to the API.

client_max_body_size 5G;

# Read / send timeouts: merges and slow clients can run for many minutes.
proxy_connect_timeout 600s;
proxy_send_timeout 3600s;
proxy_read_timeout 3600s;
send_timeout 3600s;

# Stream request body to upstream instead of buffering the whole body on disk/RAM.
# WHY: For large uploads, default buffering spikes disk I/O and memory; disabling keeps latency predictable.
proxy_request_buffering off;

# Stream response from upstream without buffering entire response.
# WHY: Reduces memory and avoids proxy timeouts when the app streams a large body (e.g. merge or downloads).
proxy_buffering off;

# Optional: increase if you still see 413 from Nginx before the request hits Node.
# large_client_header_buffers 8 64k;